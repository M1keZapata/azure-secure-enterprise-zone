<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="860" viewBox="0 0 1040 860" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Azure hub-and-spoke network architecture</title>
  <desc>Internet traffic enters through Azure Front Door with WAF, is inspected by Azure Firewall in the hub VNet, and reaches the spoke VNet over peering. The spoke hosts a virtual machine and a private endpoint to a storage account. Azure Bastion provides admin access. Logs flow to Log Analytics and Microsoft Sentinel.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#3A4A5F"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#6B3FA0"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#C4314B"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1039" height="859" rx="20" fill="#FFFFFF" stroke="#E3E8EF"/>

  <text x="48" y="58" font-size="24" font-weight="600" fill="#1B2A41">Azure hub-and-spoke network</text>
  <text x="48" y="84" font-size="14" fill="#5B6B82">Protected ingress, segmented workloads, private data access and centralized security monitoring</text>

  <!-- Internet -->
  <rect x="300" y="116" width="160" height="44" rx="22" fill="#F1F4F8" stroke="#9AA7B8"/>
  <text x="380" y="143" font-size="15" font-weight="600" fill="#1B2A41" text-anchor="middle">Internet</text>
  <line x1="380" y1="160" x2="380" y2="196" stroke="#3A4A5F" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Front Door -->
  <rect x="250" y="200" width="260" height="62" rx="10" fill="#FDECEF" stroke="#C4314B"/>
  <text x="380" y="226" font-size="15" font-weight="600" fill="#8A1C31" text-anchor="middle">Azure Front Door + WAF</text>
  <text x="380" y="246" font-size="12.5" fill="#A5374C" text-anchor="middle">Global entry point, L7 filtering</text>

  <!-- Hub VNet -->
  <rect x="48" y="290" width="664" height="160" rx="16" fill="#EFF6FC" stroke="#0078D4" stroke-dasharray="6 4"/>
  <text x="690" y="318" font-size="15" font-weight="600" fill="#005A9E" text-anchor="end">Hub VNet</text>
  <text x="690" y="337" font-size="12.5" fill="#2B6CB0" text-anchor="end">Shared services</text>

  <rect x="70" y="352" width="150" height="62" rx="10" fill="#FDECEF" stroke="#C4314B"/>
  <text x="145" y="378" font-size="15" font-weight="600" fill="#8A1C31" text-anchor="middle">Azure Bastion</text>
  <text x="145" y="398" font-size="12.5" fill="#A5374C" text-anchor="middle">Secure admin access</text>

  <rect x="250" y="352" width="260" height="62" rx="10" fill="#FDECEF" stroke="#C4314B"/>
  <text x="380" y="378" font-size="15" font-weight="600" fill="#8A1C31" text-anchor="middle">Azure Firewall</text>
  <text x="380" y="398" font-size="12.5" fill="#A5374C" text-anchor="middle">Inspects and routes traffic</text>

  <!-- Peering -->
  <line x1="380" y1="414" x2="380" y2="545" stroke="#3A4A5F" stroke-width="1.5"/>
  <rect x="325" y="463" width="110" height="24" rx="12" fill="#FFFFFF" stroke="#0078D4"/>
  <text x="380" y="479" font-size="12.5" font-weight="600" fill="#005A9E" text-anchor="middle">VNet peering</text>

  <!-- Bastion admin path -->
  <text x="140" y="479" font-size="12.5" fill="#A5374C">RDP / SSH</text>

  <!-- Spoke VNet -->
  <rect x="48" y="500" width="664" height="170" rx="16" fill="#EFF6FC" stroke="#0078D4" stroke-dasharray="6 4"/>
  <text x="690" y="528" font-size="15" font-weight="600" fill="#005A9E" text-anchor="end">Spoke VNet</text>
  <text x="690" y="547" font-size="12.5" fill="#2B6CB0" text-anchor="end">Workload tier</text>

  <path d="M240 571 L240 545 L550 545 L550 571" fill="none" stroke="#3A4A5F" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <rect x="70" y="575" width="240" height="62" rx="10" fill="#E6F4F1" stroke="#0E7C6B"/>
  <text x="190" y="601" font-size="15" font-weight="600" fill="#0A5A4E" text-anchor="middle">Virtual machine</text>
  <text x="190" y="621" font-size="12.5" fill="#1F7A6C" text-anchor="middle">Application workload</text>

  <rect x="430" y="575" width="240" height="62" rx="10" fill="#E6F4F1" stroke="#0E7C6B"/>
  <text x="550" y="601" font-size="15" font-weight="600" fill="#0A5A4E" text-anchor="middle">Private endpoint</text>
  <text x="550" y="621" font-size="12.5" fill="#1F7A6C" text-anchor="middle">Private IP for storage</text>

  <!-- Storage -->
  <line x1="550" y1="637" x2="550" y2="716" stroke="#3A4A5F" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="562" y="694" font-size="12.5" fill="#5B6B82">Private Link</text>
  <rect x="430" y="720" width="240" height="62" rx="10" fill="#E6F4F1" stroke="#0E7C6B"/>
  <text x="550" y="746" font-size="15" font-weight="600" fill="#0A5A4E" text-anchor="middle">Storage account</text>
  <text x="550" y="766" font-size="12.5" fill="#1F7A6C" text-anchor="middle">Public access disabled</text>

  <!-- Log collection -->
  <path d="M712 380 L732 380 L732 600 L712 600" fill="none" stroke="#6B3FA0" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Monitoring -->
  <rect x="752" y="290" width="240" height="380" rx="16" fill="#F5F0FA" stroke="#6B3FA0" stroke-dasharray="6 4"/>
  <text x="872" y="320" font-size="15" font-weight="600" fill="#4B2A78" text-anchor="middle">Security monitoring</text>
  <text x="872" y="339" font-size="12.5" fill="#6B3FA0" text-anchor="middle">Centralized logging</text>

  <rect x="772" y="400" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#6B3FA0"/>
  <text x="872" y="426" font-size="15" font-weight="600" fill="#4B2A78" text-anchor="middle">Log Analytics</text>
  <text x="872" y="446" font-size="12.5" fill="#6B3FA0" text-anchor="middle">Collects diagnostic logs</text>
  <line x1="872" y1="462" x2="872" y2="526" stroke="#6B3FA0" stroke-width="1.5" marker-end="url(#ahp)"/>

  <rect x="772" y="530" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#6B3FA0"/>
  <text x="872" y="556" font-size="15" font-weight="600" fill="#4B2A78" text-anchor="middle">Microsoft Sentinel</text>
  <text x="872" y="576" font-size="12.5" fill="#6B3FA0" text-anchor="middle">Threat detection (SIEM)</text>

  <!-- Connectors drawn on top of containers -->
  <line x1="380" y1="262" x2="380" y2="348" stroke="#3A4A5F" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="130" y1="414" x2="130" y2="571" stroke="#C4314B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
  <line x1="732" y1="431" x2="768" y2="431" stroke="#6B3FA0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahp)"/>

  <!-- Legend -->
  <g font-size="12.5" fill="#3A4A5F">
    <rect x="48" y="812" width="16" height="16" rx="4" fill="#FDECEF" stroke="#C4314B"/>
    <text x="72" y="825">Security and access</text>
    <rect x="228" y="812" width="16" height="16" rx="4" fill="#EFF6FC" stroke="#0078D4" stroke-dasharray="3 2"/>
    <text x="252" y="825">Virtual network</text>
    <rect x="388" y="812" width="16" height="16" rx="4" fill="#E6F4F1" stroke="#0E7C6B"/>
    <text x="412" y="825">Workload and data</text>
    <rect x="558" y="812" width="16" height="16" rx="4" fill="#F5F0FA" stroke="#6B3FA0"/>
    <text x="582" y="825">Monitoring</text>
    <line x1="700" y1="820" x2="730" y2="820" stroke="#6B3FA0" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="738" y="825">Log flow</text>
    <line x1="818" y1="820" x2="848" y2="820" stroke="#C4314B" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="856" y="825">Admin path</text>
  </g>
</svg>
